<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="indiaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9933" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="190" stroke="#334155" stroke-width="6" fill="none" stroke-dasharray="10 10" />
  
  <!-- Mountains -->
  <polygon points="120,350 220,210 320,350" fill="#334155" opacity="0.6"/>
  <polygon points="200,350 310,180 420,350" fill="url(#accentGrad)" opacity="0.9"/>
  <polygon points="310,180 270,240 350,240" fill="#ffffff" opacity="0.8"/>

  <!-- Compass Needle / Path Pin -->
  <circle cx="256" cy="170" r="14" fill="#38bdf8" />
  <path d="M256,120 L272,160 L256,150 L240,160 Z" fill="#38bdf8" />

  <!-- Road / Trail to Horizon -->
  <path d="M210,400 L250,300 L262,300 L302,400 Z" fill="#0f172a" />
  <line x1="256" y1="315" x2="256" y2="390" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 8" />

  <!-- RoamLite Tag -->
  <text x="256" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="2">ROAMLITE</text>
  <text x="256" y="468" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#f59e0b" letter-spacing="4">INDIA</text>
</svg>
